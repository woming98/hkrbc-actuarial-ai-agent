name: Verify local actuarial workflow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      HKRBC_EXTERNAL_ENABLED: 'false'
      HKRBC_LOCAL_MODEL: ''
      HKRBC_RETRIEVAL_BACKEND: bm25
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the application and tests
        run: python -m pip install '.[dev]'
      - name: Read-only offline demonstration preflight
        run: python scripts/preflight.py
      - name: Numerical, governance and interface tests
        run: python -m pytest -q
      - name: Verify distributed provenance metadata
        run: python scripts/verify_source_register.py
      - name: Deterministic workflow fixtures
        run: python evaluation/run.py
      - name: Retrieval relevance and abstention fixtures
        run: python evaluation/retrieval_eval.py --output evaluation/results/retrieval-ci.json
      - name: Expanded-corpus retrieval diagnostic
        run: python evaluation/retrieval_eval.py --cases evaluation/expanded_retrieval_cases.json --supplement data/documents/verified_supplement.json --output evaluation/results/retrieval-expanded-ci.json
      - name: Signed-service adversarial probes
        run: python evaluation/adversarial_eval.py --output evaluation/results/adversarial-ci.json
      - name: End-to-end synthetic demonstration
        run: python scripts/run_demo.py
      - name: Save measured evaluation outputs only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evaluation-python-${{ matrix.python-version }}
          path: |
            evaluation/results/offline.json
            evaluation/results/retrieval-ci.json
            evaluation/results/retrieval-expanded-ci.json
            evaluation/results/adversarial-ci.json
          if-no-files-found: error
