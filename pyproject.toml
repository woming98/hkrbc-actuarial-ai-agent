[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hkrbc-actuarial-ai-agent"
version = "0.2.0"
description = "Local-first HK RBC evidence, illustrative actuarial calculations and validation prototype"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3", "numpy>=1.26,<3", "streamlit>=1.45,<2", "pandas>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
semantic = ["sentence-transformers>=5.1,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
